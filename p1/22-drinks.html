<!DOCTYPE html>
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Variations</title>
    <style>
      body {
        font-family: "Helvetica", Monospaced;
        font-size:20px;
        margin: 0px;

        background-image: url("side.jpg");
        background-size: cover;      /* fills the area */
        background-position: center; /* centers image */
        background-repeat: no-repeat;
        background-attachment: fixed;
         background-color: rgba(184, 148, 122, 0.8); /* fallback color */
        background-blend-mode: lighten;
        height: 400px;
    }
      .featured-items {
        color: rgb(190, 36, 36);
        display: grid;
        padding: 30px;
        flex-direction: column;
        flex-wrap: nowrap;
    }

    #starters {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 1em;
        padding: 1em 0;
        color: rgb(0, 0, 0);
    }
    #salads {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap: 3em;
        padding: 1em 0;
        color: rgb(0, 0, 0);
    }
    #ramen-noodles {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 1em;
        padding: 1em 0;
        color: rgb(0, 0, 0);
    }
    #rice-plates{
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3em;
        padding: 1em 0;
    }
    #kids{
        display: grid;
        grid-template-columns: 1fr 1fr;
    }
    p{
        text-align: center;
    }
    h1{
        text-align: center;
    }
    h6{
        text-align: center;
        color: blue;
        
    }
     .ramen3 {
        position: absolute;
        top: 20px;
        right:20px;
     }
     a{
        transition:1s;
        font-size: 20px;
     }
     a:hover{
        font-size: 48px;
        color: crimson;
     }

    </style>
    
<section id="drinks">
<h4><p><strong>Drinks:</strong></p></h4>
<p>Soft Drinks / Hot Tea / Ice Tea /
Assorted Japanese Bottled Drinks /
Beer / Cold Sake / Wine</p></section>
