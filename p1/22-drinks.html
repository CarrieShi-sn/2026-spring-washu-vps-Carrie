<!DOCTYPE html>
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Variations</title>
<style>
      body {
        font-family:Riant Display semibold;
        font-size:25px;
        margin: 10px;
        letter-spacing: 0.8px;

        background-image: url("drinks..webp");
        background-size: cover;      /* fills the area */
        background-position: center; /* centers image */
        background-repeat: no-repeat;
        background-attachment: fixed;
         background-color: rgba(184, 148, 122, 0.8); /* fallback color */
        background-blend-mode: lighten;
        height: 400px;
    }
      .featured-items {
        color: rgb(190, 36, 36);
        display: grid;
        padding: 30px;
        flex-direction: column;
        flex-wrap: nowrap;
    }

    #starters {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 1em;
        padding: 1em 0;
        color: rgb(0, 0, 0);
    }
    #salads {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap: 3em;
        padding: 1em 0;
        color: rgb(0, 0, 0);
    }
    #ramen-noodles {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 1em;
        padding: 1em 0;
        color: rgb(0, 0, 0);
    }
    #rice-plates{
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3em;
        padding: 1em 0;
    }
    #kids{
        display: grid;
        grid-template-columns: 1fr 1fr;
    }
    p{
        text-align: center;
    }
    h1{
        text-align: center;
    }

    h4{
        font-family: Riant Display bold;
        font-size: 30px;
    }

    h6{
        text-align: center;
        color: blue;
        
    }
     .ramen3 {
        position: absolute;
        top: 20px;
        right:20px;
     }
     a{
        transition:1s;
        font-size: 20px;
     }
     a:hover{
        font-size: 48px;
        color: crimson;
     }

     .menu-tabs {
    position: relative;
    width: 250px;
    margin: 20px auto;
}

.menu-sticker {
    display: block;
    position: relative;
    text-decoration: none;
    text-align: center;
}

/* Image default: black & white */
.menu-sticker img {
    width: 250px;
    height: 200px;
    filter: grayscale(100%);
    transition: filter 0.6s ease, transform 0.4s ease;
}

/* On hover: back to color */
.menu-sticker:hover img {
    filter: grayscale(0%);
    transform: scale(1.05);
}

/* HOME text at bottom of sticker */
.sticker-text {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 22px;
    font-weight: bold;
    color: white;
    letter-spacing: 2px;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
}

     @media screen and (max-width: 460px){
        #body{
        grid-template-columns: 1fr;}
     }

    </style>


<h1 id="nami-ramen">NAMI RAMEN</h1>

    <a href="22.html" class="menu-sticker">
        <img src="home.png" alt="Home">
    </a>
</div>
