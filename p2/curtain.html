<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dream of the Red Chamber</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background-image: url(Lotus.jpg);
        background-size: cover;
        background-position: center;
        font-family: Georgia, serif;

        display: flex; /* NAV LEFT + STAGE RIGHT */
        flex-direction: row;
    }

    /* ---------------- VERTICAL NAVIGATION BAR ---------------- */
    .nav-band {
        width: 18vh;             /* narrow vertical bar */
        min-width: 120px;
        height: 100vh;

        background: rgba(168, 65, 205, 0.12);
        backdrop-filter: blur(4px);
        border-right: 1px solid rgba(255,255,255,0.25);

        display: flex;
        align-items: baseline;
        justify-content: center;
        padding-top: 40px;
    }

    .nav-container {
        display: flex;
        flex-direction: column;  /* vertical stack */
        gap: 20px;
    }

    .nav-tab {
        font-size: 20px;
        color: white;
        letter-spacing: 2px;
        cursor: pointer;
        text-orientation: upright;
        top: 10%;
        padding: 1px;

        transition: opacity 0.3s ease, transform 0.2s ease;
        position: relative;
    }

    .nav-tab .dot {
        width: 6px;
        height: 6px;
        background: white;
        border-radius: 50%;
        position: absolute; /* sit next to the tab */
        top: 50%;
        right: 47%;
        transform: translateY(-50%);
        opacity: 0;     /* hidden by default */
        transition: opacity 0.3s ease;
    }

    .nav-tab.active .dot {
        opacity: 1;
    }

    .nav-tab:hover {
        opacity: 0.7;
        transform: translateX(4px);
    }

    /* ---------------- STAGE ---------------- */
    .stage {
        display: flex;
        height: 100vh;
        width: calc(100vw - 18vh); /* space next to vertical nav */
        position: relative;
    }

    .curtain-left,
    .curtain-right {
        flex: 1;
        transition: transform 1s ease-in-out, filter 0.6s ease;
        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 14px;
        text-align: center;
        padding: 10px;
    }

    .curtain-left {
        background-color: rgba(240, 248, 255, 0.1);
    }

    .curtain-right {
        background: linear-gradient(to left, #b2cfec, #dfcbdf, rgba(226, 231, 234, 0.9));
        color: #8b98b4;
    }

    .curtain-left:not(:first-child),
    .curtain-right:not(:first-child) {
        margin-left: -25px;
    }

    .curtain-left:hover {
        transform: translateX(20px) translateZ(100px) scaleX(1.05);
        background-color: rgba(97, 112, 125, 0.2);
        z-index: 20;
        filter: brightness(0.2);
        background-image: url(flower.gif);
        background-size: cover;
        background-position: center;
        transition: 1s ease-in-out;
    }

    .curtain-right:hover {
        transform: translateX(20px) translateZ(100px) scaleX(1.05);
        z-index: 20;
        filter: brightness(1.2);
    }


    .name {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-shadow: 0 0 25px rgba(89, 42, 42, 0.6);
    }

    .english {
        font-size: 14px;
        letter-spacing: 1px;
        cursor: pointer;
    }

    .chinese {
        writing-mode: vertical-rl;
        text-orientation: upright;
        font-size: 25px;
        letter-spacing: 6px;
        font-family: Libian SC;
    }
</style>
</head>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const current = window.location.pathname.split("/").pop().replace(".html", "");

    document.querySelectorAll(".nav-tab").forEach(tab => {
        if (tab.dataset.page === current) {
            tab.classList.add("active");
        }
    });
});
