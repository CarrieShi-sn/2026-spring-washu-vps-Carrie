<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dream of the Red Chamber</title>
<style>
/* ---------- BASIC STYLING ---------- */
body {
    margin: 0;
    font-family: Georgia, serif;
    overflow-x: hidden;
    background-image: url('Lotus.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

/* ---------- HERO ---------- */
.hero {
    height: 100vh;
    position: relative;
    perspective: 1200px;
    overflow: hidden;
}

/* ---------- CURTAINS ---------- */
.stage {
    display: flex;
    height: 100%;
    width: 100%;
    position: absolute;
    top: 0;
    left: 0;
}

.curtain {
    flex: 1;
    min-width: 0;
    height: 100%;
    background: linear-gradient(to bottom, rgba(178,207,236,0.4), rgba(223,203,223,0.4));
    transform-origin: top center;
    transition: transform 0.3s ease-out;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
}

.curtain .name {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: Libian SC;
    font-size: 26px;
    color: #333;
    margin-top: 20px;
    user-select: none;
}

/* ---------- STRONG WIND EFFECT ---------- */
</style>
</head>
<body>

<section class="hero">

<div class="stage">
    <div class="curtain"><div class="name">Lin Daiyu 林黛玉</div></div>
    <div class="curtain"><div class="name">Xue Baochai 薛宝钗</div></div>
    <div class="curtain"><div class="name">Jia Yuanchun 贾元春</div></div>
    <div class="curtain"><div class="name">Jia Tanchun 贾探春</div></div>
    <div class="curtain"><div class="name">Shi Xiangyun 史湘云</div></div>
    <div class="curtain"><div class="name">Miaoyu 妙玉</div></div>
    <div class="curtain"><div class="name">Jia Yingchun 贾迎春</div></div>
    <div class="curtain"><div class="name">Jia Xichun 贾惜春</div></div>
    <div class="curtain"><div class="name">Wang Xifeng 王熙凤</div></div>
    <div class="curtain"><div class="name">Qin Keqing 秦可卿</div></div>
    <div class="curtain"><div class="name">Li Wan 李纨</div></div>
    <div class="curtain"><div class="name">Jia Qiaojie 贾巧姐</div></div>
</div>

</section>

<!-- ---------- SCRIPT: CURSOR WIND ---------- -->
<script>
const curtains = document.querySelectorAll('.curtain');
const maxSwing = 15; // max degrees of swing for subtle motion

document.addEventListener('mousemove', e => {
    const stageRect = document.querySelector('.stage').getBoundingClientRect();
    const mouseX = e.clientX - stageRect.left;
    const stageWidth = stageRect.width;

    curtains.forEach((curtain, index) => {
        const curtainCenter = curtain.offsetLeft + curtain.offsetWidth/2;
        const distance = Math.abs(mouseX - curtainCenter);
        const influence = Math.max(0, 1 - distance/stageWidth*3); // nearby curtains respond more
        const angle = maxSwing * influence * ((mouseX - curtainCenter)/stageWidth*2);
        curtain.style.transform = `rotateZ(${angle}deg)`;
    });
});

// Return to rest when mouse leaves stage
document.querySelector('.stage').addEventListener('mouseleave', () => {
    curtains.forEach(c => c.style.transform = 'rotateZ(0deg)');
});
</script>

</body>
</html>
